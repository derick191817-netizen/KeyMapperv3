name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keymapper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7.0.1

      - name: Configurar JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      # O Wrapper oficial agora está versionado com o projeto: nenhuma instalação
      # global do Gradle é necessária para compilar em novos runners.
      - name: Validar Gradle Wrapper versionado
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -s ./gradlew
          test -s ./gradlew.bat
          test -s ./gradle/wrapper/gradle-wrapper.jar
          test -s ./gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.8-bin.zip' gradle/wrapper/gradle-wrapper.properties
          echo 'cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          ./gradlew --no-daemon --version

      - name: Validar ambiente e estrutura
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --no-daemon --version
          sdkmanager --version
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-34"
          test -x "$sdk_root/build-tools/34.0.0/aapt"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/example/keymapper
          grep -q 'include(":app")' settings.gradle.kts
          grep -q 'com.android.application' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose' build.gradle.kts
          grep -q 'compileSdk = 34' app/build.gradle.kts
          if grep -R -n --include='*.kt' --include='*.kts' 'Configuration.DENSITY_DEFAULT' app; then
            echo 'ERRO: referência Configuration.DENSITY_DEFAULT encontrada.' >&2
            exit 1
          fi
          if grep -n 'hasSource(' app/src/main/java/com/example/keymapper/input/InputDeviceManager.kt; then
            echo 'ERRO: InputDeviceManager.kt ainda contém hasSource(); confira a API InputDevice.' >&2
            exit 1
          fi
          grep -q 'supportsSource(' app/src/main/java/com/example/keymapper/input/InputDeviceManager.kt
          echo 'Estrutura, versões declaradas e ambiente verificados.'

      - name: Listar tarefas do módulo app
        run: ./gradlew --no-daemon :app:tasks --all

      - name: Compilar Kotlin Debug
        run: ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Executar testes unitários Debug
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verificar APK e gerar checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -size +0c -print | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo 'ERRO: nenhum APK Debug não vazio foi encontrado.' >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          aapt="$sdk_root/build-tools/34.0.0/aapt"
          test -x "$aapt"
          for apk in "${apks[@]}"; do
            echo "Validando: $apk"
            file "$apk"
            unzip -t "$apk" >/dev/null
            "$aapt" dump badging "$apk" | grep -F "package: name='com.example.keymapper'"
          done
          sha256sum "${apks[@]}" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v7.0.2
        with:
          name: keymapper-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
