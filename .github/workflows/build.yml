name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keymapper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar matriz do toolchain Android
        run: python3 ./tools/build-tests/check-toolchain-compatibility.py

      - name: Testar falhas do verificador do toolchain
        run: python3 ./tools/build-tests/test-toolchain-compatibility.py

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Validar políticas nativas no host
        run: |
          bash ./tools/native-tests/run.sh
          bash ./tools/native-tests/check-syntax.sh
          bash ./tools/native-tests/check-library-contract.sh
          bash ./tools/dependency-tests/check-kadb-coordinates.sh
          bash ./tools/dependency-tests/check-jetifier-ignorelist.sh
          bash ./tools/dependency-tests/test-kadb-selected-version.sh
          bash ./tools/architecture-tests/check-wireless-adb-boundary.sh
          bash ./tools/architecture-tests/check-shizuku-session-isolation.sh
          bash ./tools/architecture-tests/check-session-start-idempotency.sh
          bash ./tools/architecture-tests/check-hud-placement-policy.sh
          bash ./tools/architecture-tests/check-overlay-window-placement.sh
          bash ./tools/architecture-tests/check-visible-control-types.sh
          bash ./tools/architecture-tests/check-macro-sequence-contract.sh
          bash ./tools/architecture-tests/check-control-activation-ownership.sh
          bash ./tools/architecture-tests/check-settings-profile-recovery.sh
          bash ./tools/architecture-tests/check-aidl-contract.sh

      - name: Confirmar versão Kadb Android resolvida
        run: bash ./tools/dependency-tests/verify-kadb-selected-version.sh

      - name: Executar análise estática Android (Lint)
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace --console=plain

      - name: Executar testes unitários
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace --console=plain

      - name: Gerar APK Debug
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace --console=plain

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: keymapper-0.14.66-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
