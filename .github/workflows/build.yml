name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keymapper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e compilar APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/example/keymapper
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q 'include(":app")' settings.gradle.kts
          grep -q 'id("com.android.application")' app/build.gradle.kts
          grep -q 'namespace = "com.example.keymapper"' app/build.gradle.kts
          grep -q 'compileSdk = 34' app/build.gradle.kts
          grep -q 'gradle-8.8-bin.zip' gradle/wrapper/gradle-wrapper.properties
          if grep -R -n --include='*.kt' --include='*.kts' 'Configuration.DENSITY_DEFAULT' app; then
            echo 'ERRO: Configuration.DENSITY_DEFAULT encontrado.' >&2
            exit 1
          fi
          if grep -R -n --include='*.kt' 'hasSource(' app/src/main/java/com/example/keymapper; then
            echo 'ERRO: hasSource() encontrado; use supportsSource().' >&2
            exit 1
          fi
          grep -q 'supportsSource(' app/src/main/java/com/example/keymapper/input/InputDeviceManager.kt
          chmod +x ./gradlew

      - name: Verificar Gradle Wrapper e versões
        run: ./gradlew --no-daemon --version

      - name: Pré-validar módulo Android e tarefa assembleDebug
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Projetos Gradle ---'
          ./gradlew --no-daemon projects --stacktrace --console=plain
          echo '--- Tarefas do módulo :app ---'
          ./gradlew --no-daemon :app:tasks --all --stacktrace --console=plain | tee app-tasks.txt
          if ! grep -Eq '(^|[[:space:]])assembleDebug([[:space:]]|$)' app-tasks.txt; then
            echo 'ERRO: :app não registrou assembleDebug.' >&2
            echo 'Verifique include(":app"), app/build.gradle.kts e o plugin com.android.application.' >&2
            exit 1
          fi
          echo '--- Verificação de configuração Android ---'
          ./gradlew --no-daemon :app:properties --console=plain | tee app-properties.txt
          grep -F 'com.example.keymapper' app-properties.txt

      - name: Executar testes unitários
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Gerar APK Debug
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Validar APK gerado
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -size +0c -print | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo 'ERRO: nenhum APK Debug foi gerado.' >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          aapt="$sdk_root/build-tools/34.0.0/aapt"
          test -x "$aapt"
          for apk in "${apks[@]}"; do
            unzip -t "$apk" >/dev/null
            "$aapt" dump badging "$apk" | grep -F "package: name='com.example.keymapper'"
          done
          sha256sum "${apks[@]}" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: keymapper-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
