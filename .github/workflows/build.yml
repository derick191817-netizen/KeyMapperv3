name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keymapper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7.0.1

      - name: Configurar JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Este ZIP não tem Gradle Wrapper. Até que o Wrapper oficial seja gerado
      # e validado em ambiente com Gradle, fixamos explicitamente a versão usada no CI.
      - name: Configurar Gradle 8.8
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.8'
          cache-provider: basic

      # Bootstrap: como o ZIP inicial não traz Wrapper, geramos os arquivos oficiais
      # com Gradle 8.8 instalado pela action e passamos a usar ./gradlew no restante do job.
      - name: Gerar e validar Gradle Wrapper oficial
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 8.8 --distribution-type bin
          chmod +x gradlew
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.8-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version
          mkdir -p build/wrapper-bundle
          cp gradlew gradlew.bat build/wrapper-bundle/
          mkdir -p build/wrapper-bundle/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties build/wrapper-bundle/gradle/wrapper/
          tar -czf build/gradle-wrapper-generated.tar.gz -C build/wrapper-bundle .

      - name: Validar ambiente e estrutura
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --version
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-34"
          test -x "$sdk_root/build-tools/34.0.0/aapt"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/example/keymapper
          grep -q 'include(":app")' settings.gradle.kts
          grep -q 'com.android.application' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose' build.gradle.kts
          grep -q 'compileSdk = 34' app/build.gradle.kts
          if grep -R -n --include='*.kt' --include='*.kts' 'Configuration.DENSITY_DEFAULT' app; then
            echo 'ERRO: referência Configuration.DENSITY_DEFAULT encontrada.' >&2
            exit 1
          fi
          if grep -n 'hasSource(' app/src/main/java/com/example/keymapper/input/InputDeviceManager.kt; then
            echo 'ERRO: InputDeviceManager.kt ainda contém hasSource(); confira a API InputDevice.' >&2
            exit 1
          fi
          grep -q 'supportsSource(' app/src/main/java/com/example/keymapper/input/InputDeviceManager.kt
          echo 'Estrutura, versões declaradas e ambiente verificados.'

      - name: Listar tarefas do módulo app
        run: ./gradlew --no-daemon :app:tasks --all

      - name: Compilar Kotlin Debug
        run: ./gradlew --no-daemon :app:compileDebugKotlin --stacktrace

      - name: Executar testes unitários Debug
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verificar APK e gerar checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -size +0c -print | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo 'ERRO: nenhum APK Debug não vazio foi encontrado.' >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          aapt="$sdk_root/build-tools/34.0.0/aapt"
          test -x "$aapt"
          for apk in "${apks[@]}"; do
            echo "Validando: $apk"
            file "$apk"
            unzip -t "$apk" >/dev/null
            "$aapt" dump badging "$apk" | grep -F "package: name='com.example.keymapper'"
          done
          sha256sum "${apks[@]}" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v7.0.1
        with:
          name: keymapper-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14


      - name: Publicar arquivos do Gradle Wrapper gerado
        uses: actions/upload-artifact@v7.0.1
        with:
          name: keymapper-gradle-wrapper
          path: build/gradle-wrapper-generated.tar.gz
          if-no-files-found: error
          retention-days: 14
